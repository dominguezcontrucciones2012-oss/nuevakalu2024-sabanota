<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALU - Registro de Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap');

        :root {
            --kalu-blue: #3498db;
            --kalu-dark: #1a252f;
            --kalu-glass: rgba(255, 255, 255, 0.05);
            --kalu-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: url('/static/fondo_negocio_jpg.png') no-repeat center center fixed !important;
            background-size: cover !important;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            font-family: 'Outfit', sans-serif;
            color: white;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);
            z-index: -1;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            padding: 15px;
            animation: fadeInUp 0.8s ease-out;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--kalu-border);
            border-radius: 40px;
            padding: 45px 35px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.65);
        }

        .brand-logo-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 0;
            text-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .brand-subtitle {
            color: var(--kalu-blue);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            margin-top: -5px;
        }

        .form-section-title {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 1px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
            transition: 0.3s;
            z-index: 10;
        }

        .form-control-custom {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            padding: 16px 20px 16px 55px !important;
            border-radius: 20px !important;
            font-size: 1rem !important;
            font-weight: 500 !important;
            transition: all 0.3s ease !important;
            width: 100%;
        }

        .form-control-custom::placeholder {
            color: rgba(255, 255, 255, 0.35) !important;
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: var(--kalu-blue) !important;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.25) !important;
            outline: none !important;
        }

        .form-control-custom:focus + i {
            color: var(--kalu-blue);
        }

        .form-label-outside {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.6);
            padding-left: 5px;
        }

        .btn-submit {
            background: var(--kalu-blue);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.2);
        }

        .btn-submit:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(52, 152, 219, 0.35);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .alert-float {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: white;
        }

        .footer-back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .footer-back-btn:hover {
            color: var(--kalu-blue);
        }
        
        /* Ajuste específico para inputs de tipo fecha en navegadores */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
            cursor: pointer;
        }
    </style>
</head>

<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} alert-float animate__animated animate__fadeInRight" role="alert">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="register-container">
        <div class="glass-card">
            <div class="brand-logo-box">
                <h1 class="brand-title">KALU</h1>
                <div class="brand-subtitle">Registro de Clientes</div>
            </div>

            <div class="form-section-title">
                Crea tu Cuenta de Acceso ✨
            </div>

            <form action="{{ url_for('auth.registro') }}" method="POST" autocomplete="off">
                <!-- Campo: Nombre Completo -->
                <div class="mb-3">
                    <label class="form-label-outside">Nombre Completo</label>
                    <div class="input-group-custom">
                        <input type="text" name="nombre" class="form-control-custom" placeholder="Ej: Juan Pérez" required>
                        <i class="fas fa-user"></i>
                    </div>
                </div>

                <!-- Campo: Cédula de Identidad -->
                <div class="mb-3">
                    <label class="form-label-outside">Cédula de Identidad</label>
                    <div class="input-group-custom">
                        <input type="text" name="cedula" class="form-control-custom" placeholder="Ej: V-12345678" required>
                        <i class="fas fa-id-card"></i>
                    </div>
                </div>

                <!-- Campo: Teléfono -->
                <div class="mb-3">
                    <label class="form-label-outside">Número de Teléfono</label>
                    <div class="input-group-custom">
                        <input type="tel" name="telefono" class="form-control-custom" placeholder="Ej: 04141234567">
                        <i class="fas fa-phone"></i>
                    </div>
                </div>

                <!-- Campo: Fecha de Nacimiento -->
                <div class="mb-4">
                    <label class="form-label-outside">Fecha de Nacimiento</label>
                    <div class="input-group-custom">
                        <input type="date" name="fecha_nacimiento" class="form-control-custom" required>
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" class="btn btn-submit w-100 shadow">
                    <i class="fas fa-user-plus me-2"></i> REGISTRARME Y ENTRAR
                </button>

                <!-- Regresar -->
                <a href="{{ url_for('auth.ingresar') }}" class="footer-back-btn">
                    <i class="fas fa-arrow-left me-1"></i> Ya tengo cuenta. Iniciar Sesión
                </a>
            </form>
        </div>
    </div>

    <script>
        // Ocultar alertas flotantes automáticamente después de 4 segundos
        setTimeout(() => {
            const alerts = document.querySelectorAll('.alert-float');
            alerts.forEach(alert => {
                alert.classList.remove('animate__fadeInRight');
                alert.classList.add('animate__fadeOutRight');
                setTimeout(() => alert.remove(), 1000);
            });
        }, 4000);
    </script>
</body>

</html>
