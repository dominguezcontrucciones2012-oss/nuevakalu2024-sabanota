version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: mi-web-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: .
    container_name: mi-web-api
    restart: always
    environment:
      - UPLOAD_DIR=/var/www/app/uploads
      - PORT=3001
    volumes:
      - uploads_data:/var/www/app/uploads

volumes:
  uploads_data:
