<!-- prettier-ignore -->
{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="card shadow border-0">
    <div class="card-header bg-warning text-dark fw-bold">
      <i class="fas fa-edit"></i> CORREGIR PRODUCTO: {{ p.nombre }}
    </div>
    <form action="{{ url_for('inventario.editar_producto', id=p.id) }}" method="POST">
      <div class="card-body">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Código Principal</label>
            <input type="text" name="codigo" class="form-control" value="{{ p.codigo }}" required />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Nombre del Producto</label>
            <input type="text" name="nombre" class="form-control" value="{{ p.nombre }}" required />
          </div>
        </div>

        <div class="mb-3">
          <button class="btn btn-outline-secondary btn-sm fw-bold border-0" type="button" data-bs-toggle="collapse" data-bs-target="#codigos_adicionales_collapse">
            <i class="fas fa-barcode"></i> Ver/Editar códigos de barra adicionales (hasta 4 en total)
          </button>
          <div class="collapse {% if p.codigo2 or p.codigo3 or p.codigo4 %}show{% endif %} mt-2" id="codigos_adicionales_collapse">
            <div class="card card-body bg-light border-0 py-2 px-3">
              <div class="row">
                <div class="col-md-4 mb-2">
                  <label class="form-label small fw-bold mb-1">Código de Barra 2</label>
                  <input type="text" name="codigo2" class="form-control form-control-sm" value="{{ p.codigo2 or '' }}" placeholder="Opcional" autocomplete="off" />
                </div>
                <div class="col-md-4 mb-2">
                  <label class="form-label small fw-bold mb-1">Código de Barra 3</label>
                  <input type="text" name="codigo3" class="form-control form-control-sm" value="{{ p.codigo3 or '' }}" placeholder="Opcional" autocomplete="off" />
                </div>
                <div class="col-md-4 mb-2">
                  <label class="form-label small fw-bold mb-1">Código de Barra 4</label>
                  <input type="text" name="codigo4" class="form-control form-control-sm" value="{{ p.codigo4 or '' }}" placeholder="Opcional" autocomplete="off" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-12 mb-3">
            <label class="form-label fw-bold">Categoría</label>
            <select name="categoria" class="form-select fw-bold">
              {% for cat in categorias %}
              <option value="{{ cat }}" {%if p.categoria==cat%}selected{%endif %}>
                {{ cat }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold text-danger">Costo ($)</label>
            <input type="number" step="0.01" name="costo_usd" class="form-control" value="{{ p.costo_usd }}" required />
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold text-primary">Precio Full ($)</label>
            <input type="number" step="0.01" name="precio_normal_usd" class="form-control"
              value="{{ p.precio_normal_usd }}" required />
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold text-success">Precio Oferta ($)</label>
            <input type="number" step="0.01" name="precio_oferta_usd" class="form-control"
              value="{{ p.precio_oferta_usd }}" required />
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Stock Actual</label>
            <input type="number" step="0.001" name="stock" class="form-control" value="{{ p.stock }}" required />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Stock Mínimo</label>
            <input type="number" step="0.001" name="stock_minimo" class="form-control" value="{{ p.stock_minimo }}"
              required />
          </div>
        </div>
      </div>
      <div class="card-footer bg-light d-flex justify-content-between">
        <a href="{{ url_for('inventario.lista_inventario') }}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-warning fw-bold">
          <i class="fas fa-save"></i> GUARDAR CAMBIOS
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
